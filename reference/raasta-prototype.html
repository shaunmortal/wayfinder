<title>Raasta Hospital Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: navy rail · ask + steps column · 2.5D floor map. Phones stack ask → map → steps, with a bottom tab bar. */
:root{
  --bg:#ECF0F6; --surface:#FFFFFF; --surface-2:#F3F6FB; --ink:#0F1B2D; --ink-2:#46566C; --line:#D8E0EB;
  --nav:#0E2645; --nav-2:#173761; --nav-line:#2B4C78; --nav-ink:#E4ECF8; --nav-ink-2:#A9BCD8;
  --primary:#1557E6; --primary-2:#0E45BF; --primary-soft:#E3EBFD; --primary-ink:#0E45BF; --on-primary:#FFFFFF; --focus:#1557E6; --route:#1557E6;
  --danger:#C9342A; --danger-soft:#FCE5E2; --danger-ink:#B12A21; --ok-ink:#11734F; --shadow-c:rgba(15,27,45,.07);
  --m-ground:#E4EAF2; --m-dot:#CBD5E3; --m-shadow:rgba(30,50,90,.12); --m-corr:#F8FAFD; --m-slab:#BFCADA; --m-slab-2:#AFBCCF;
  --m-wall-in:#EAEFF5; --m-wall-out:#DDE4EE; --m-wall-side:#CFD8E5; --m-rim:#98A9C0; --m-door:#7F93AE; --label-halo:rgba(255,255,255,.92);
  --c-opd:#D6E3FA; --c-test:#D3EEDD; --c-ward:#FAE6C6; --c-emergency:#F8D3CF; --c-service:#E1E6EE; --c-admin:#E7DCF6; --c-core:#C9D3E1;
  --route-dim:#9DB7EE; --dest-fill:#FFD9D4;
  --m-lawn:#D5E8CC; --m-lawn-line:#B7D3A9; --m-road:#F4F6F9; --b-s:#C2CEDD; --b-e:#AFBDD0; --c-stay:#F6D6E4; --c-park:#E3E7EE;
  --sc-ceil:#EEF2F7; --sc-wl:#E0E7F0; --sc-wr:#D5DDE8; --sc-fl:#C7D1DF; --sc-bk:#F4F7FB; --sc-lt:#FFFFFF; --sc-door:#A3B5CB; --sc-open:#7C90AC; --sc-frame:#B8C5D6;
  --font:"Hind","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-lg:18px; --r-md:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A111D; --surface:#111B2B; --surface-2:#172438; --ink:#E6EDF7; --ink-2:#9EAFC6; --line:#24344C;
    --nav:#07101E; --nav-2:#122340; --nav-line:#22385C; --nav-ink:#E4ECF8; --nav-ink-2:#93A8C6;
    --primary:#2F66E6; --primary-2:#2556CC; --primary-soft:#172A4F; --primary-ink:#A9C3FF; --on-primary:#FFFFFF; --focus:#8AB0FF; --route:#5B8EFF;
    --danger:#C9342A; --danger-soft:#3B1B1A; --danger-ink:#FF9A91; --ok-ink:#5FD3A4; --shadow-c:rgba(0,0,0,.35);
    --m-ground:#0D1524; --m-dot:#1A263A; --m-shadow:rgba(0,0,0,.45); --m-corr:#1A2537; --m-slab:#24324A; --m-slab-2:#1C283E;
    --m-wall-in:#2A3954; --m-wall-out:#233149; --m-wall-side:#1D2A42; --m-rim:#4C6285; --m-door:#6A82A6; --label-halo:rgba(11,18,30,.9);
    --c-opd:#203A66; --c-test:#1B4434; --c-ward:#4A3A1D; --c-emergency:#56241F; --c-service:#2B394F; --c-admin:#3A2D58; --c-core:#33415A;
    --route-dim:#36558F; --dest-fill:#6A2B25; --m-lawn:#17281F; --m-lawn-line:#22392B; --m-road:#2A374D; --b-s:#33435E; --b-e:#2A3850; --c-stay:#4A2738; --c-park:#2B3549;
    --sc-ceil:#1A2537; --sc-wl:#22304A; --sc-wr:#1D2A41; --sc-fl:#2B3A55; --sc-bk:#27364F; --sc-lt:#64799C; --sc-door:#3D5272; --sc-open:#0C1422; --sc-frame:#3A4D6B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A111D; --surface:#111B2B; --surface-2:#172438; --ink:#E6EDF7; --ink-2:#9EAFC6; --line:#24344C;
  --nav:#07101E; --nav-2:#122340; --nav-line:#22385C; --nav-ink:#E4ECF8; --nav-ink-2:#93A8C6;
  --primary:#2F66E6; --primary-2:#2556CC; --primary-soft:#172A4F; --primary-ink:#A9C3FF; --on-primary:#FFFFFF; --focus:#8AB0FF; --route:#5B8EFF;
  --danger:#C9342A; --danger-soft:#3B1B1A; --danger-ink:#FF9A91; --ok-ink:#5FD3A4; --shadow-c:rgba(0,0,0,.35);
  --m-ground:#0D1524; --m-dot:#1A263A; --m-shadow:rgba(0,0,0,.45); --m-corr:#1A2537; --m-slab:#24324A; --m-slab-2:#1C283E;
  --m-wall-in:#2A3954; --m-wall-out:#233149; --m-wall-side:#1D2A42; --m-rim:#4C6285; --m-door:#6A82A6; --label-halo:rgba(11,18,30,.9);
  --c-opd:#203A66; --c-test:#1B4434; --c-ward:#4A3A1D; --c-emergency:#56241F; --c-service:#2B394F; --c-admin:#3A2D58; --c-core:#33415A;
  --route-dim:#36558F; --dest-fill:#6A2B25; --m-lawn:#17281F; --m-lawn-line:#22392B; --m-road:#2A374D; --b-s:#33435E; --b-e:#2A3850; --c-stay:#4A2738; --c-park:#2B3549;
  --sc-ceil:#1A2537; --sc-wl:#22304A; --sc-wr:#1D2A41; --sc-fl:#2B3A55; --sc-bk:#27364F; --sc-lt:#64799C; --sc-door:#3D5272; --sc-open:#0C1422; --sc-frame:#3A4D6B;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:block}
h2,h3{text-wrap:balance}

/* ---------- app shell ---------- */
.app{display:grid;height:100%;padding:12px;gap:12px;
  grid-template-columns:236px minmax(330px,390px) minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"side head map" "side body map";}
.side{grid-area:side}.head{grid-area:head}.body{grid-area:body}.mapwrap{grid-area:map}.topbar{grid-area:top}
.app.is-nav .head{display:none}
.app.is-nav{grid-template-areas:"side body map" "side body map"}

.side{background:var(--nav);color:var(--nav-ink);border-radius:var(--r-lg);display:flex;flex-direction:column;gap:18px;padding:18px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;padding:0 4px}
.logo{flex:none;width:42px;height:42px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.brand-t{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.brand-t b{font-size:20px;font-weight:700;letter-spacing:.01em}
.brand-t span{font-size:13px;color:var(--nav-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 12px;border:0;border-radius:11px;background:transparent;color:var(--nav-ink);font-size:15.5px;font-weight:500;text-align:left}
.navbtn:hover{background:var(--nav-2)}
.navbtn[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
.navbtn.is-emg .ic{color:var(--danger-ink)}
.navbtn.is-emg:hover .ic{color:var(--nav-ink)}
.side-card{margin-top:auto;background:var(--nav-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.side-card b{font-size:16px;line-height:1.25}
.side-card p{margin:0;font-size:13.5px;color:var(--nav-ink-2)}
.langbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 14px;border-radius:11px;border:1px solid var(--nav-line);background:transparent;color:var(--nav-ink);font-weight:600}
.langbtn:hover{background:var(--nav-2)}
.topbar{display:none;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--nav);color:var(--nav-ink);border-radius:var(--r-lg)}
.tabbar{display:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 1px 2px var(--shadow-c),0 8px 24px var(--shadow-c)}
.head{padding:14px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:6}
.body{padding:16px;overflow:auto;min-height:0}

/* ---------- head: start + ask ---------- */
.startchip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 6px 8px 12px;background:var(--surface-2);border-radius:12px}
.here-dot{width:16px;height:16px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 5px var(--primary-soft)}
.sc-tx{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.sc-tx b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-tx .sub{font-size:13px;color:var(--ink-2)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.ask{position:relative;display:flex;flex-direction:column;gap:6px}
.ask-label{font-size:13px;font-weight:600;color:var(--ink-2)}
.askbox{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:13px;padding:0 6px 0 12px;background:var(--surface);min-height:52px;color:var(--ink-2)}
.askbox:focus-within{border-color:var(--primary)}
.askbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;padding:10px 0;color:var(--ink)}
.askbox input::placeholder{color:var(--ink-2);opacity:.8}
.askgo{width:40px;height:40px;border-radius:10px;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.askgo:hover{background:var(--primary-2)}
.sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 32px var(--shadow-c);display:flex;flex-direction:column;gap:2px;max-height:330px;overflow:auto}
.sg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 8px;border:0;border-radius:10px;background:transparent;text-align:left}
.sg:hover,.sg:focus-visible{background:var(--surface-2)}
.sg-n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-f{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.sg-ai{grid-template-columns:auto minmax(0,1fr);color:var(--primary-ink);font-weight:600;border-top:1px solid var(--line);border-radius:0 0 10px 10px;margin-top:2px}
.sg-empty{margin:0;padding:10px;color:var(--ink-2);font-size:14px}
.aimsg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--primary-soft);color:var(--ink);font-size:14.5px}
.aimsg .ic{color:var(--primary-ink);margin-top:2px}
.aimsg p{margin:0}
.aimsg .src{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--primary-ink)}
.aimsg.note{background:var(--surface-2)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--primary-soft);border-top-color:var(--primary);animation:spin .8s linear infinite;margin-top:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink)}
.chip:hover{background:var(--surface-2)}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink)}
.sw{width:10px;height:10px;border-radius:3px;background:var(--cc,var(--c-service));flex:none}
.cat-opd{--cc:var(--c-opd)}.cat-test{--cc:var(--c-test)}.cat-ward{--cc:var(--c-ward)}.cat-emergency{--cc:var(--c-emergency)}.cat-service{--cc:var(--c-service)}.cat-admin{--cc:var(--c-admin)}
.code{display:inline-grid;place-items:center;min-width:46px;height:30px;padding:0 6px;border-radius:8px;background:var(--cc);font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--ink)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:transparent;color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-2)}
.btn.danger{background:var(--danger);border-color:transparent;color:var(--on-primary)}
.btn.big{width:100%;min-height:54px;font-size:17px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink)}
.btn-link{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--primary-ink);font-weight:600;padding:8px 10px;border-radius:9px;min-height:40px}
.btn-link:hover{background:var(--primary-soft)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--surface-2)}

/* ---------- body views ---------- */
.vh{margin:0 0 4px;font-size:20px;line-height:1.2}
.vd{margin:0;color:var(--ink-2);font-size:14.5px;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:16px}
.dest{display:flex;flex-direction:column;gap:14px}
.dest-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
.thumb{width:78px;height:78px;border-radius:16px;background:var(--cc);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:17px;color:var(--ink);position:relative;overflow:hidden}
.thumb svg{position:absolute;inset:auto 0 0 0;width:100%;height:auto;opacity:.5}
.thumb span{position:relative}
.dest h2{margin:0;font-family:var(--mono);font-size:24px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.dest-name{margin:2px 0 0;font-size:17px;font-weight:600;line-height:1.3}
.crumb{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.dest-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--ink-2);font-size:15px;font-variant-numeric:tabular-nums}
.dest-meta span{display:inline-flex;align-items:center;gap:6px}
.dest-meta .sep{width:1px;height:18px;background:var(--line)}
.sf{display:flex;gap:8px;align-items:center;margin:0;font-size:14px;color:var(--ok-ink);font-weight:500}
.sf.warn{color:var(--danger-ink)}
.toggles{display:flex;flex-wrap:wrap;gap:4px 18px;padding-top:2px;border-top:1px solid var(--line)}
.tg{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-size:14.5px;font-weight:500;cursor:pointer;position:relative}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.tg-ui{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .15s;flex:none}
.tg-ui::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px var(--shadow-c);transition:transform .15s}
.tg input:checked + .tg-ui{background:var(--primary)}
.tg input:checked + .tg-ui::after{transform:translateX(16px)}
.tg input:focus-visible + .tg-ui{outline:3px solid var(--focus);outline-offset:2px}
.warnbox{margin:0;padding:12px 14px;border-radius:12px;background:var(--danger-soft);color:var(--ink);font-size:14.5px}
.oknote{margin:0;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14.5px}
.sec-t{margin:0 0 6px;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.st-btn{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;border-radius:0}
.steps li:last-child .st-btn{border-bottom:0}
.st-btn:hover{background:var(--surface-2)}
.st-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-ink)}
.k-start .st-ic{background:var(--primary);color:var(--on-primary)}
.k-arrive .st-ic{background:var(--danger-soft);color:var(--danger-ink)}
.st-tx{padding-top:7px;font-size:15px;line-height:1.4}
.st-m{padding-top:8px;text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.35}
.st-btn.cur{background:var(--primary-soft)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.prow:hover{background:var(--surface-2)}
.prow .pn{font-weight:600;display:block;line-height:1.25}
.prow .pf{font-size:13px;color:var(--ink-2)}
.prow > .ic{color:var(--ink-2)}
.grp{margin:16px 0 2px;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.grp:first-child{margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.fcard{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;min-height:120px}
.fcard:hover{border-color:var(--primary)}
.fcard[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.fcard b{font-size:16px}
.fcard .fid{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.fcard p{margin:0;font-size:13.5px;color:var(--ink-2)}
.fcard .sws{display:flex;gap:4px;margin-top:auto}
.card2{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.card2 h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.card2 p{margin:0;font-size:14.5px;color:var(--ink-2)}
.card2.emg{border-color:var(--danger)}
.card2.emg h3 .ic{color:var(--danger-ink)}
.about p{margin:0 0 8px;font-size:14px;color:var(--ink-2);max-width:62ch}
details.more summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--primary-ink)}
.codegrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;margin-top:6px}
.codegrid code{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.codegrid span{color:var(--ink-2)}

/* ---------- navigation mode ---------- */
.navv{display:flex;flex-direction:column;gap:14px}
.nv-banner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--nav);color:var(--nav-ink);border-radius:16px;padding:16px}
.nv-ic{width:58px;height:58px;border-radius:15px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.nv-instr{margin:0;font-size:20px;font-weight:600;line-height:1.3;text-wrap:pretty}
.nv-meta{margin:4px 0 0;font-size:13.5px;color:var(--nav-ink-2);font-family:var(--mono);font-variant-numeric:tabular-nums}
.nv-prog{display:flex;gap:4px}
.nv-prog span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.nv-prog span.on{background:var(--primary)}
.nv-scene{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--sc-ceil)}
.scene-svg{display:block;width:100%;height:auto;max-width:100%}
.scene-photo{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.dest-photo{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin:12px 0 4px;border:1px solid var(--line)}

/* =====================================================================
   3. GRAPH  ·  build each site's nodes and edges, shortest path, steps
   ===================================================================== */
const TH=20*Math.PI/180, CT=Math.cos(TH), ST=Math.sin(TH), KY=0.64, WALL=11;
function P(x,y,z){ z=z||0; return [Math.round((x*CT-y*ST)*10)/10, Math.round(((x*ST+y*CT)*KY-z)*10)/10]; }

function buildGraph(site){
  const G={NODES:{},ADJ:{},PLACE:{},FL:{}};
  site.floors.forEach((f,i)=>{ f.i=i; G.FL[f.id]=f; });
  const add=(id,floor,x,y,kind,ref)=>{ if(G.NODES[id]) throw new Error('Duplicate node '+id); G.NODES[id]={id,floor,x,y,kind,ref}; G.ADJ[id]=[]; };
  const link=(a,b,type,extra,len)=>{
    const A=G.NODES[a], B=G.NODES[b]; if(!A||!B) throw new Error(`Unknown node in link: ${a} / ${b}`);
    const L=len!=null?len:Math.hypot(A.x-B.x,A.y-B.y)/SCALE, cost=L+(extra||0);
    G.ADJ[a].push({to:b,type,len:L,cost}); G.ADJ[b].push({to:a,type,len:L,cost});
  };
  site.points.forEach(p=>add(p.id,p.floor,p.x,p.y,'corr'));
  site.walks.forEach(([a,b])=>link(a,b,'walk'));
  site.cores.forEach(c=>{ add(c.id,c.floor,c.at[0],c.at[1],c.kind,c); link(c.id,c.via,'walk',c.kind==='lift'?10:0); });
  site.places.forEach(p=>{
    if(p.num==null) p.num=/^(\d|[A-Z]-\d)/.test(p.id);
    p.code=p.code||p.id; G.PLACE[p.id]=p;
    add(p.id,p.floor,p.door[0],p.door[1],p.gate?'gate':'place',p); link(p.id,p.via,'walk');
  });
  const groups={}; site.cores.forEach(c=>{ (groups[c.group]=groups[c.group]||[]).push(c); });
  Object.values(groups).forEach(cs=>{
    cs.sort((a,b)=>G.FL[a.floor].i-G.FL[b.floor].i);
    for(let i=0;i<cs.length-1;i++){ const gap=G.FL[cs[i+1].floor].i-G.FL[cs[i].floor].i; link(cs[i].id,cs[i+1].id,cs[i].kind,cs[i].kind==='lift'?3*gap:25*gap,0); }
  });
  G.STARTABLE=Object.keys(G.NODES).filter(id=>['place','gate','lift','stairs'].includes(G.NODES[id].kind));
  G.WC=site.places.filter(p=>p.code==='WC').map(p=>p.id);
  const xs=[],ys=[], push=(x,y)=>[WALL,-8].forEach(z=>{ const q=P(x,y,z); xs.push(q[0]); ys.push(q[1]); });
  Object.values(site.shells).forEach(list=>list.forEach(r=>{ push(r[0],r[1]); push(r[2],r[1]); push(r[2],r[3]); push(r[0],r[3]); }));
  Object.values(site.shellPoly||{}).forEach(list=>list.forEach(poly=>poly.forEach(([x,y])=>push(x,y))));
  site.places.forEach(p=>{ if(p.labelAt) push(p.labelAt[0],p.labelAt[1]+10); push(p.door[0],p.door[1]); if(p.rect){ push(p.rect[0],p.rect[1]); push(p.rect[2],p.rect[3]); } (p.parts||[]).forEach(q=>{ push(q.r[0],q.r[1]); push(q.r[2],q.r[3]); }); (p.poly||[]).forEach(([x,y])=>push(x,y)); });
  site.points.forEach(p=>push(p.x,p.y));
  Object.values(site.ground||{}).forEach(poly=>poly.forEach(([x,y])=>push(x,y)));
  G.PB=[Math.min(...xs)-24,Math.min(...ys)-24,Math.max(...xs)+24,Math.max(...ys)+24];
  site.G=G;
}
SITES.forEach(buildGraph);

let S, NODES, ADJ, PLACE, FL, STARTABLE, WC_IDS, PB;
function useSite(site){ S=site; ({NODES,ADJ,PLACE,FL,STARTABLE,PB}=site.G); WC_IDS=site.G.WC; }
const siteById=id=>SITES.find(s=>s.id===id);
const isStartable=id=>!!NODES[id] && ['place','gate','lift','stairs'].includes(NODES[id].kind);

function edgeOf(a,b){ return ADJ[a].find(e=>e.to===b); }
function dijkstra(from,to,o){
  const dist={[from]:0}, prev={}, done=new Set(), pq=[[0,from]];
  while(pq.length){
    let bi=0; for(let i=1;i<pq.length;i++) if(pq[i][0]<pq[bi][0]) bi=i;
    const [d,u]=pq.splice(bi,1)[0];
    if(done.has(u)) continue; done.add(u);
    if(u===to) break;
    for(const e of ADJ[u]){
      if(o.stepFree && e.type==='stairs') continue;
      if(o.liftDown && e.type==='lift') continue;
      const v=e.to, k=NODES[v].kind;
      if((k==='place'||k==='gate') && v!==to) continue;
      const nd=d+e.cost;
      if(dist[v]===undefined || nd<dist[v]){ dist[v]=nd; prev[v]=u; pq.push([nd,v]); }
    }
  }
  if(dist[to]===undefined) return null;
  const path=[to]; while(path[0]!==from) path.unshift(prev[path[0]]);
  return {path, cost:dist[to]};
}
function unitVec(a,b){ const dx=b.x-a.x, dy=b.y-a.y, l=Math.hypot(dx,dy)||1; return [dx/l,dy/l]; }
function turnOf(h1,h2){ const dot=h1[0]*h2[0]+h1[1]*h2[1]; if(dot>0.85) return null; const cr=h1[0]*h2[1]-h1[1]*h2[0]; return cr>0?'right':'left'; }

function buildSteps(path){
  const N=path.map(id=>NODES[id]);
  const raw=[]; let i=0;
  while(i<path.length-1){
    const e=edgeOf(path[i],path[i+1]);
    if(e.type!=='walk'){
      let j=i+1; while(j<path.length-1 && edgeOf(path[j],path[j+1]).type===e.type) j++;
      raw.push({type:e.type,i0:i,i1:j,v0:i,v1:j}); i=j; continue;
    }
    const h=unitVec(N[i],N[i+1]); let len=e.len, j=i+1;
    while(j<path.length-1){
      const e2=edgeOf(path[j],path[j+1]); if(e2.type!=='walk') break;
      const h2=unitVec(N[j],N[j+1]); if(h[0]*h2[0]+h[1]*h2[1]<0.85) break;
      len+=e2.len; j++;
    }
    raw.push({type:'walk',i0:i,i1:j,h,len}); i=j;
  }
  let prevH=null;
  raw.forEach(r=>{ if(r.type==='walk'){ r.turn=prevH?turnOf(prevH,r.h):null; prevH=r.h; } else prevH=null; });

  const steps=[{kind:'start',i0:0,i1:0,floor:N[0].floor}];
  let k=0;
  if(raw[0] && raw[0].type==='walk' && raw[0].len<6 && N[0].kind!=='gate'){ steps[0].i1=raw[0].i1; k=1; }
  let afterV=null;
  for(;k<raw.length;k++){
    const r=raw[k], nx=raw[k+1], last=k===raw.length-1;
    if(r.type==='walk'){
      if(nx && nx.type!=='walk' && r.len<6){ nx.approach=r.turn; nx.i0=r.i0; continue; }
      if(afterV && r.len<6 && nx && nx.type==='walk'){ nx.exitKind=afterV; nx.i0=r.i0; afterV=null; continue; }
      if(last && r.len<5 && r.turn){ steps.push({kind:'arrive',side:r.turn,i0:r.i0,i1:r.i1,floor:N[r.i1].floor}); continue; }
      const st={kind:'walk',turn:r.turn,len:r.len,i0:r.i0,i1:r.i1,floor:N[r.i0].floor,h:r.h};
      if(r.exitKind) st.exitKind=r.exitKind;
      if(afterV){ st.exitKind=afterV; afterV=null; }
      steps.push(st);
      if(last) steps.push({kind:'arrive',side:null,i0:r.i1,i1:r.i1,floor:N[r.i1].floor});
    } else {
      const from=N[r.v0].floor, to=N[r.v1].floor;
      steps.push({kind:r.type,approach:r.approach||null,i0:r.i0,i1:r.i1,v0:r.v0,v1:r.v1,from,to,
        n:Math.abs(FL[to].i-FL[from].i), up:FL[to].i>FL[from].i, floor:from});
      afterV=r.type;
      if(last) steps.push({kind:'arrive',side:null,i0:r.i1,i1:r.i1,floor:to});
    }
  }
  return steps;
}
function stepSecs(st){
  if(st.kind==='walk') return st.len/WALK_MPS;
  if(st.kind==='lift') return 40+6*st.n;
  if(st.kind==='stairs') return 25*st.n;
  return 0;
}

function computeRoute(){
  if(!state.dest){ state.route=null; return; }
  if(state.start===state.dest){ state.route={same:true,path:[state.start],steps:[]}; return; }

function localMatch(q){
  const s=String(q||'').toLowerCase().trim(); if(!s) return [];
  const words=s.split(/[^a-z0-9ऀ-ॿ]+/).filter(w=>w.length>=2);
  const blood=/blood|khoon|khun|खून|ब्लड|रक्त|rakt/.test(s);
  const test=/test|jaanch|janch|jaach|jach|जाँच|जांच|sample|सैंपल|टेस्ट/.test(s);
  const toilet=/toilet|bathroom|washroom|shauch|शौच|latrine|टॉयलेट/.test(s);
  const sf=NODES[state.start].floor, sid=s.replace(/[\s-]/g,'');
  const res=[];
  for(const p of S.places){
    const hay=[p.id,p.en,p.hi,p.enS,p.hiS,p.kw].join(' ').toLowerCase();
    let sc=0;
    for(const w of words) if(hay.includes(w)) sc+=w.length>=4?2:1;
    if(sid===p.id.toLowerCase().replace(/-/g,'')) sc+=20;
    if(S.blood){ if(blood && !test && p.id===S.blood.bank) sc+=8; if(blood && test && p.id===S.blood.test) sc+=8; }
    if(toilet && p.code==='WC') sc+=p.floor===sf?8:3;
    if(sc>0) res.push({p,sc});
  }
  res.sort((a,b)=>b.sc-a.sc || a.p.id.localeCompare(b.p.id));
  return res.map(r=>r.p);
}

/* =====================================================================
   9. ACTIONS
   ===================================================================== */
function goTo(id){
  if(id==='WC') id=nearestOf(WC_IDS);
  if(!PLACE[id]) return;
  if(aiCtl){ aiCtl.abort(); aiCtl=null; if(state.ai.status==='thinking') state.ai={status:'idle'}; }
  state.dest=id; state.nav=false; state.stepIdx=0; state.view='home';
  computeRoute(); state.floor=NODES[state.start].floor;
  closeSugg(); renderChrome(); renderHead(); renderBody(); renderMap(); fitRoute();
  if(isPhone()) $('#mapwrap').scrollIntoView({behavior:'smooth',block:'start'});
}
function setStart(id){
  if(!isStartable(id)) return;
  state.start=id; state.floor=NODES[id].floor; state.view='home'; state.nav=false; state.photo={status:'idle'};
  computeRoute(); renderAll(); fitRoute(); toast(t('startSet',spotLabel(id)));
}
function switchSite(id,startId){
  if(aiCtl){ aiCtl.abort(); aiCtl=null; }
  try{ speechSynthesis.cancel(); }catch(e){}
  enterSite(id,startId); buildFloors(); computeRoute(); renderAll(); fitRoute();
}
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang=isHi()?'hi-IN':'en-IN'; u.rate=0.95;
    const v=speechSynthesis.getVoices().find(v=>(v.lang||'').toLowerCase().startsWith(isHi()?'hi':'en-in')); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function focusStep(){
  const st=state.route.steps[state.stepIdx];
  state.floor=st.floor; renderBody(); renderMap(); fitStep(st);
  const b=$('#body'); if(b) b.scrollTop=0;
  if(state.voice) speak(stepText(st));
}
function navStart(i){
  const r=state.route; if(!r||!r.steps||!r.steps.length) return;
  state.nav=true; state.stepIdx=i||0; renderChrome(); focusStep();
  if(isPhone()) $('#mapwrap').scrollIntoView({behavior:'smooth',block:'start'});
}
function navEnd(arrived){
  state.nav=false; try{ speechSynthesis.cancel(); }catch(e){}
  renderChrome(); renderHead(); renderBody(); renderMap(); fitRoute();
  if(arrived) toast(t('arrived'));
}
function act(el){
  const a=el.dataset.act;
  switch(a){
    case 'view':
      if(el.dataset.v==='emg'){ if(S.help&&S.help.emg) goTo(S.help.emg); return; }
      state.view=el.dataset.v; if(state.nav){ state.nav=false; try{ speechSynthesis.cancel(); }catch(e){} }
      renderChrome(); renderHead(); renderBody(); renderMap();
      if(isPhone()&&state.view!=='home') $('#body').scrollIntoView({behavior:'smooth',block:'start'});
      break;
    case 'site': if(el.dataset.s!==S.id) switchSite(el.dataset.s); break;
    case 'link': switchSite(el.dataset.s,el.dataset.n); if(S.parent && S.defaults.dest && S.defaults.dest!==state.start) goTo(S.defaults.dest); break;
    case 'dest': goTo(el.dataset.id); break;
    case 'start': setStart(el.dataset.id); break;
    case 'ask': askClaude($('#q')?$('#q').value:''); break;
    case 'stopai': if(aiCtl){ aiCtl.abort(); } break;
    case 'closeai': state.ai={status:'idle'}; renderAiMsg(); break;
    case 'clear': state.dest=null; state.route=null; state.ai={status:'idle'}; renderHead(); renderBody(); renderMap(); fitFloor(); break;
    case 'floor':
      state.floor=el.dataset.f;
      if(state.view==='floors') renderBody();
      renderMap(); (routeFloors().has(state.floor)?fitRoute:fitFloor)();
      if(isPhone() && el.classList.contains('fcard')) $('#mapwrap').scrollIntoView({behavior:'smooth',block:'start'});
      break;
    case 'zin': zoomCenter(0.75); break;
    case 'zout': zoomCenter(1.33); break;
    case 'zfit': fitFloor(); break;
    case 'v3d': set3D(!V3.on); try{ localStorage.setItem('raasta-3d',V3.on?'1':'0'); }catch(e){} break;
    case 'lang':
      state.lang=isHi()?'en':'hi'; try{ localStorage.setItem('raasta-lang',state.lang); }catch(e){}
      if(state.ai.status==='done') state.ai={status:'idle'};
      if(state.photo.status!=='reading') state.photo={status:'idle'};
      buildFloors(); renderAll(); break;
    case 'navstart': navStart(0); break;
    case 'navend': navEnd(false); break;
    case 'step': navStart(+el.dataset.i); break;
    case 'next': if(state.stepIdx<state.route.steps.length-1){ state.stepIdx++; focusStep(); } else navEnd(true); break;
    case 'prev': if(state.stepIdx>0){ state.stepIdx--; focusStep(); } break;
    case 'voice':
      state.voice=!state.voice; el.setAttribute('aria-pressed',String(state.voice));
      if(state.voice) speak(stepText(state.route.steps[state.stepIdx])); else { try{ speechSynthesis.cancel(); }catch(e){} }
      break;
    case 'cat': state.cat=el.dataset.c; renderBody(); break;
    case 'photo': $('#photoIn').click(); break;
  }
}
document.addEventListener('click',e=>{
  if(e.target.closest('#map')) return;
  const el=e.target.closest('[data-act]');
  if(el && !el.disabled){ act(el); return; }
  if(!e.target.closest('.ask')) closeSugg();
});
document.addEventListener('keydown',e=>{
  const el=e.target;
  if((e.key==='Enter'||e.key===' ') && el.classList && el.classList.contains('bdg')){ e.preventDefault(); act(el); return; }
  if(e.key==='Escape') closeSugg();
  if(state.nav && !/INPUT|TEXTAREA/.test(el.tagName||'')){
    if(e.key==='ArrowRight'){ e.preventDefault(); act({dataset:{act:'next'}}); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); act({dataset:{act:'prev'}}); }
  }
});

});
document.addEventListener('change',e=>{
  if(e.target.id==='tg-sf'){ state.stepFree=e.target.checked; computeRoute(); renderBody(); renderMap(); fitRoute(); }
  if(e.target.id==='tg-lift'){ state.liftDown=e.target.checked; computeRoute(); renderBody(); renderMap(); fitRoute(); }
  if(e.target.id==='photoIn'){ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(f) locateByPhoto(f); }
});
window.addEventListener('hashchange',()=>{
  const h=readHash(); const owner=SITES.find(s=>s.id===h||s.G.NODES[h]);
  if(!owner) return;
  if(owner.id!==S.id) switchSite(owner.id, owner.id===h?null:h);
  else if(h!==owner.id) setStart(h);
});

/* boot */
enterSite(DEFAULT_SITE,null);
applyHash(readHash(),true);
buildFloors(); computeRoute(); renderAll();
requestAnimationFrame(()=>{ fitRoute(); });
let want3d=true; try{ if(localStorage.getItem('raasta-3d')==='0') want3d=false; }catch(e){}
if(want3d) set3D(true);

/* for the team: test routes from the browser console, e.g. raastaDebug.steps('302','101') */
window.raastaDebug={ v3:()=>V3, site:()=>S.id, steps(from,to,o){ const r=dijkstra(from,to,o||{}); if(!r) return null; r.steps=buildSteps(r.path); return r.steps.map(s=>stepText(s,r)); }, nodes:()=>NODES };
})();
</script>
